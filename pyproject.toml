[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrist-sensor-robustness"
version = "0.1.0"
description = "How fragile is wrist-worn activity recognition to real sensor faults, and can a data-quality validator catch bad windows first?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code); WISDM data is CC BY 4.0" }
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "xgboost>=2.0",
  "scipy>=1.12", "matplotlib>=3.8", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:sklearn"]
